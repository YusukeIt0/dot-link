<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>スマホの方角の確認 · Beta</title>
  <style>
    :root { color-scheme: light dark; font: 17px/1.55 system-ui, sans-serif; }
    body { margin: auto; padding: 1rem; max-width: 34rem; } h1 { font-size: 1.45rem; }
    button, textarea { font: inherit; } button { padding: .65rem .9rem; margin: .2rem 0; }
    textarea { width: 100%; box-sizing: border-box; }
  </style>
</head>
<body>
  <h1 data-en="Phone compass check · Beta">スマホの方角の確認 · Beta</h1>
  <p data-en="Place the phone flat, screen up. Remember where its top points. The test uses three positions. No map or knowledge of north is needed.">スマホを机に平らに置き、画面を上にしてください。スマホの上端が向く先を一つ覚えます。測るのは3回です。地図や北の確認は要りません。</p>
  <p data-en="The phone may request motion or location access. The result contains changes of angle. Coordinates and the starting direction are not saved or sent.">動きや位置情報の許可が表示されることがあります。記録するのは角度の変化です。座標と最初の方角は保存・送信しません。</p>
  <p id="status" role="status" data-en="1 of 3. Keep the phone pointing in its starting direction.">1 / 3　スマホを最初の向きに置いてください。</p>
  <button id="measure" data-en="Start in this position">この向きで始める</button>
  <button id="stop" data-en="Stop" hidden>中止</button>
  <button id="copy" data-en="Copy result" hidden>結果をコピー</button>
  <textarea id="result" aria-label="測定結果" readonly rows="4" hidden></textarea>
  <script type="module" src="./probe.js"></script>
</body>
</html>

name: Branch validation
on:
  push:
    branches-ignore: [main]
permissions:
  contents: read
concurrency:
  group: branch-validation-${{ github.ref }}-${{ github.run_attempt > 1 && github.run_id || 'current' }}
  cancel-in-progress: true
jobs:
  branch-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.admission.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/branch-ci-admission.mjs
      - run: sh scripts/check-workflows.sh
  branch-test:
    needs: branch-preflight
    if: ${{ !cancelled() && needs.branch-preflight.result == 'success' && needs.branch-preflight.outputs.run == 'true' }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require current triggering revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-current.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          package-manager-cache: false
          cache: npm
      - run: sh scripts/run-ci-tests.sh

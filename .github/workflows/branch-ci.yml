name: Branch validation
on:
  push:
    branches-ignore: [main]
permissions:
  contents: read
concurrency:
  group: branch-validation-${{ github.ref }}-${{ github.run_attempt > 1 && github.run_id || 'current' }}
  cancel-in-progress: true
jobs:
  branch-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.admission.outputs.run }}
      runner: ${{ steps.impact.outputs.runner }}
      base: ${{ steps.impact.outputs.base }}
      head: ${{ steps.impact.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/branch-ci-admission.mjs
      - run: sh scripts/check-workflows.sh
      - name: Verify impact policy on Linux
        run: node --test tests/ci-plan.test.mjs tests/ci-release-metadata.test.mjs
      - id: impact
        run: node scripts/ci-plan.mjs --event
  branch-test:
    needs: branch-preflight
    if: ${{ !cancelled() && needs.branch-preflight.result == 'success' && needs.branch-preflight.outputs.run == 'true' }}
    runs-on: ${{ needs.branch-preflight.outputs.runner || 'macos-15' }}
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require current triggering revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-current.mjs
      - name: Recheck PR ownership after runner allocation
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/branch-ci-admission.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.admission.outputs.run == 'true'
        with:
          node-version: '26.13.0'
          package-manager-cache: false
          cache: ${{ needs.branch-preflight.outputs.runner == 'macos-15' && 'npm' || '' }}
      - name: Run impact-selected validation
        if: steps.admission.outputs.run == 'true'
        env:
          CI_BASE: ${{ needs.branch-preflight.outputs.base }}
          CI_HEAD: ${{ needs.branch-preflight.outputs.head }}
        run: node scripts/run-ci-plan.mjs "$CI_BASE" "$CI_HEAD"

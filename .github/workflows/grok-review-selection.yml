name: Grok review selection
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, reopened, edited, synchronize, labeled, unlabeled]
  issues:
    types: [edited, labeled, unlabeled]
  # Reconcile manually linked issues and classification changes made by GITHUB_TOKEN.
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional PR number; otherwise inspect open PRs
        type: string
        required: false
permissions: {}
concurrency:
  group: dot-link-grok-selection-${{ github.event.pull_request.number || inputs.pr_number || 'all' }}
  cancel-in-progress: false
jobs:
  select:
    if: >-
      github.repository == 'YusukeIt0/dot-link' &&
      (github.event_name != 'pull_request_target' || github.event.pull_request.base.ref == 'main') &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Add review labels to qualifying fixes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            node scripts/select-grok-reviews.mjs --apply "$PR_NUMBER"
          else
            node scripts/select-grok-reviews.mjs --apply
          fi

name: Independent review selection
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, reopened, edited, synchronize, labeled, unlabeled]
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created, edited]
  issues:
    types: [edited, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional PR number; otherwise inspect open PRs
        type: string
        required: false
permissions: {}
concurrency:
  group: dot-link-grok-selection-${{ github.event.comment.id || github.event.pull_request.number || inputs.pr_number || 'all' }}
  cancel-in-progress: false
jobs:
  select:
    if: >-
      github.repository == 'YusukeIt0/dot-link' &&
      (github.event_name != 'issue_comment' || (github.event.issue.pull_request != null && contains(github.event.comment.body, '/dotlink review2nd'))) &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      # PR label writes require write access to the pull request resource.
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Add review labels to qualifying fixes
        env:
          REVIEW_HEAD_CHANGED: ${{ github.event_name == 'pull_request_target' && github.event.action == 'synchronize' }}
          COMMENT_ID: ${{ github.event.comment.id }}
          GROK_REVIEW_WEBHOOK_URL: ${{ secrets.GROK_REVIEW_WEBHOOK_URL }}
          GROK_REVIEW_WEBHOOK_KEY: ${{ secrets.GROK_REVIEW_WEBHOOK_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        run: |
          if [ -n "$COMMENT_ID" ]; then
            node scripts/select-grok-reviews.mjs --apply --comment "$COMMENT_ID"
          elif [ -n "$PR_NUMBER" ]; then
            node scripts/select-grok-reviews.mjs --apply "$PR_NUMBER"
          else
            node scripts/select-grok-reviews.mjs --apply
          fi

name: Pinned runtime watch
# Weekly report for pinned runtimes Dependabot cannot track (#274): Node.js/npm,
# Sparkle, tunnel-client and whisper.cpp. Read-only except one tracking issue;
# it never edits pins, checksums or code.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions: {}
concurrency:
  group: pinned-runtime-watch
  cancel-in-progress: false
jobs:
  watch:
    if: github.repository == 'YusukeIt0/dot-link' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - name: Report pinned runtime updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-pinned-runtimes.mjs --issue

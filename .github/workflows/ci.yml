name: Tests
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
concurrency:
  # Manual retries cannot cancel the latest ordinary validation.
  group: tests-${{ github.event.pull_request.number || github.ref }}-${{ github.run_attempt > 1 && github.run_id || 'current' }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: sh scripts/check-workflows.sh
  test:
    needs: workflow-lint
    if: ${{ !cancelled() }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Require successful workflow checks
        env:
          LINT_RESULT: ${{ needs.workflow-lint.result }}
        run: test "$LINT_RESULT" = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require current triggering revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-current.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: npm
      - run: sh scripts/run-ci-tests.sh

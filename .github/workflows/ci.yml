name: Tests
# Run title is fixed at dispatch; run.pull_requests base metadata changes on retarget.
run-name: >-
  ${{ github.event.action == 'edited' && github.event.changes.base == null && format('CI ignored | pr={0} | head={1}', github.event.pull_request.number, github.event.pull_request.head.sha) || github.event_name == 'pull_request' && format('CI v1 | pr={0} | head={1} | base={2} | ref={3}', github.event.pull_request.number, github.event.pull_request.head.sha, github.event.pull_request.base.sha, github.event.pull_request.base.ref) || format('CI v1 | push={0}', github.sha) }}
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
concurrency:
  # Manual retries cannot cancel the latest ordinary validation.
  group: tests-${{ github.event.action == 'edited' && github.event.changes.base == null && format('ignored-{0}', github.run_id) || github.event.pull_request.number || github.ref }}-${{ github.run_attempt > 1 && github.run_id || 'current' }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  workflow-lint:
    name: ${{ github.event.action == 'edited' && github.event.changes.base == null && 'ignored-workflow-lint' || 'workflow-lint' }}
    if: ${{ github.event.action != 'edited' || github.event.changes.base != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: sh scripts/check-workflows.sh
  test:
    name: ${{ github.event.action == 'edited' && github.event.changes.base == null && 'ignored-test' || 'test' }}
    needs: workflow-lint
    if: ${{ !cancelled() && (github.event.action != 'edited' || github.event.changes.base != null) }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Require successful workflow checks
        env:
          LINT_RESULT: ${{ needs.workflow-lint.result }}
        run: test "$LINT_RESULT" = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require current triggering revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-current.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: npm
      - run: sh scripts/run-ci-tests.sh

name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: sh scripts/check-workflows.sh
  test:
    needs: workflow-lint
    if: always()
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Require successful workflow checks
        env:
          LINT_RESULT: ${{ needs.workflow-lint.result }}
        run: test "$LINT_RESULT" = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:http
      - run: npm run build
      - run: sh scripts/test-notification-native.sh

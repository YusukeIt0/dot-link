version: 2
# Dependency update proposals (#274, #286). All version updates for npm (root and
# tools/evenhub) and GitHub Actions arrive as ONE weekly pull request through a
# multi-ecosystem group. Each PR receives the ordinary CI and an automatic
# dotsweeper review; the implementing AI fixes review findings on the PR; then it
# stops for the maintainer's merge decision (dependency-bot PRs are never merged
# automatically). Security updates are separate and immediate. Node.js, npm,
# Sparkle, tunnel-client and whisper.cpp pins are covered by the pinned-runtime
# watch instead; see docs/dependency-updates.md.
multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: weekly
updates:
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
  - package-ecosystem: npm
    directory: /tools/evenhub
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
